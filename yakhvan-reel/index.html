<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>یخ‌وان — ادیت ریلز</title>
<style>
  @font-face { font-family: Vazirmatn; src: url(fonts/Vazirmatn-Light.woff2) format("woff2"); font-weight: 300; }
  @font-face { font-family: Vazirmatn; src: url(fonts/Vazirmatn-Regular.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Vazirmatn; src: url(fonts/Vazirmatn-Bold.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Vazirmatn; src: url(fonts/Vazirmatn-Black.woff2) format("woff2"); font-weight: 900; }
  @font-face { font-family: Lalezar; src: url(fonts/Lalezar-Arabic.woff2) format("woff2"); unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: Lalezar; src: url(fonts/Lalezar-Latin.woff2) format("woff2"); unicode-range: U+0000-00FF; }

  :root { --ice: #63e2ee; --lemon: #ffe14d; --coral: #ff6b5b; --ink: #0e2430; }
  html, body { margin: 0; height: 100%; background: #0b1418; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Vazirmatn, sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #fff; background: #000; }
  #stage > * { position: absolute; }
  canvas { inset: 0; }

  /* ---------- captions ---------- */
  #cap { left: 70px; right: 70px; height: 0; }
  .grp { position: absolute; left: 0; right: 0; bottom: 0; display: none; text-align: center;
         font-weight: 900; font-size: 74px; line-height: 1.32; }
  .w { display: inline-block; padding: 0 14px; margin: 4px 0; border-radius: 22px; position: relative;
       white-space: nowrap; color: #fff;
       text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 0 24px rgba(0,0,0,.55);
       -webkit-text-stroke: 2px rgba(0,0,0,.35); paint-order: stroke fill; }
  .w.kw { color: var(--ice); }
  .w .pill { position: absolute; inset: 6px 0 2px; border-radius: 22px; background: var(--lemon); z-index: -1;
             box-shadow: 0 8px 0 rgba(0,0,0,.25); opacity: 0; }
  .w.on { color: var(--ink); text-shadow: none; -webkit-text-stroke: 0; }
  .w.on .pill { opacity: 1; }

  /* ---------- hook title ---------- */
  #hook { left: 0; right: 0; top: 960px; text-align: center; font-family: Lalezar, Vazirmatn; line-height: 1.12; }
  #hook .l { display: block; white-space: nowrap; }
  #hook .a { font-size: 104px; color: #fff; text-shadow: 0 7px 0 rgba(14,36,48,.6); }
  #hook .b { font-size: 150px; color: var(--ink); }
  #hook .b span { display: inline-block; background: var(--lemon); padding: 0 34px 10px; border-radius: 30px;
                  box-shadow: 0 12px 0 rgba(14,36,48,.35); }

  /* ---------- step chip ---------- */
  #chip { top: 170px; left: 60px; display: flex; align-items: center; gap: 22px; opacity: 0;
          background: rgba(255,255,255,.92); color: var(--ink); border-radius: 999px; padding: 14px 40px 18px 18px;
          font-weight: 900; font-size: 50px; box-shadow: 0 14px 40px rgba(0,0,0,.25); white-space: nowrap; }
  #chip .n { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%;
             background: var(--ice); font-family: Lalezar; font-size: 60px; padding-top: 6px; box-sizing: border-box; }

  /* ---------- stickers ---------- */
  #stickers { inset: 0; pointer-events: none; }
  .stk { position: absolute; left: 0; top: 0; width: 150px; text-align: center; font-size: 150px; line-height: 1; opacity: 0;
         filter: drop-shadow(0 14px 18px rgba(0,0,0,.35)); font-family: "Noto Color Emoji"; }

  /* ---------- time race: 7 hours / 30 minutes / 6-7 minutes ---------- */
  #vs { left: 70px; right: 70px; top: 860px; opacity: 0; }
  #vs .row { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px;
             border-radius: 36px; padding: 12px 40px 16px; background: rgba(14,36,48,.84); color: #fff;
             box-shadow: 0 16px 44px rgba(0,0,0,.3); opacity: 0; transform-origin: 50% 50%; }
  #vs .row.win { background: var(--lemon); color: var(--ink); padding: 20px 40px 24px; }
  #vs .lbl { font-weight: 700; font-size: 44px; white-space: nowrap; }
  #vs .val { font-family: Lalezar; font-size: 92px; line-height: 1.15; position: relative; white-space: nowrap; }
  #vs .win .val { font-size: 124px; }
  #vs .strike { position: absolute; left: -14px; right: -14px; top: 50%; height: 12px; border-radius: 6px;
                background: var(--coral); transform-origin: 100% 50%; transform: rotate(-6deg) scaleX(0); }

  /* ---------- ingredients ---------- */
  #ing { left: 40px; top: 600px; width: 520px; opacity: 0; }
  #ing .ttl { display: inline-block; font-family: Lalezar; font-size: 66px; color: var(--ink); background: var(--lemon);
              padding: 0 30px 8px; border-radius: 26px; margin-bottom: 18px; box-shadow: 0 10px 0 rgba(14,36,48,.3); }
  #ing .row { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; padding: 14px 16px 14px 24px;
              background: rgba(255,255,255,.93); border-radius: 30px; color: var(--ink); opacity: 0;
              box-shadow: 0 12px 30px rgba(0,0,0,.22); }
  #ing .ico { width: 104px; height: 104px; flex: none; border-radius: 50%; background: #dff8fb; display: grid;
              place-items: center; font-family: "Noto Color Emoji"; font-size: 60px; }
  #ing .nm { font-weight: 900; font-size: 50px; line-height: 1.25; }
  #ing .am { font-weight: 700; font-size: 34px; line-height: 1.3; opacity: .75; }

  /* ---------- progress ---------- */
  #bar { left: 0; right: 0; top: 0; height: 10px; background: rgba(255,255,255,.18); }
  #bar i { position: absolute; right: 0; top: 0; bottom: 0; background: linear-gradient(270deg, var(--ice), #b6f6ff); }

  /* ---------- end card ---------- */
  #end { inset: 0; display: grid; place-items: center; opacity: 0; }
  #end .box { text-align: center; }
  #end .logo { font-family: Lalezar; font-size: 300px; line-height: 1; color: #fff;
               text-shadow: 0 12px 0 rgba(14,36,48,.45); }
  #end .tag { margin-top: 30px; font-weight: 700; font-size: 54px; color: var(--ink); background: var(--lemon);
              display: inline-block; padding: 8px 40px 14px; border-radius: 999px; }
  #end .cta { margin-top: 70px; font-weight: 400; font-size: 44px; opacity: .9; }

  #controls { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); font: 14px system-ui; }
  #controls button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid #fff6;
    background: #0008; color: #fff; cursor: pointer; }
  .render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cam" width="1080" height="1920"></canvas>
  <div id="hook"></div>
  <div id="chip"><span class="n"></span><span class="txt"></span></div>
  <div id="stickers"></div>
  <div id="vs"></div>
  <div id="ing"><div class="ttl"></div></div>
  <div id="cap"></div>
  <div id="end"><div class="box">
    <div class="logo">یخ‌وان</div>
    <div class="tag"></div>
    <div class="cta"></div>
  </div></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="bar"><i></i></div>
</div>
<div id="controls"><button id="play">پخش</button></div>

<script src="edit.js"></script>
<script>
const W = 1080, H = 1920, FPS = 30, SW = 720, SH = 1280;
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.documentElement.classList.add('render');
const { SHOTS, CAPS, HOOK, STEPS, STICKERS, VS, ING, CAMLOCK, END, DURATION } = window.EDIT;

// ---------- helpers ----------
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, k) => a + (c - a) * k;
const prog = (t, a, c) => clamp((t - a) / (c - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const $ = s => document.querySelector(s);

// ---------- shots & camera ----------
// shot i spans [SHOTS[i].t, SHOTS[i+1].t); 'talk' shots get alternating framings
// at phrase boundaries, 'broll' gets a slow push-in.
const shots = SHOTS.map((s, i) => ({ ...s, end: i + 1 < SHOTS.length ? SHOTS[i + 1].t : DURATION + 1 }));
const shotAt = t => { let k = 0; while (k + 1 < shots.length && shots[k + 1].t <= t + 1e-6) k++; return k; };

// framings in source pixels: scale and the source point that sits at the canvas centre
const FACE = { x: 440, y: 520 };
const FRAMES = {
  wide:  { s: 1.0,  x: 360, y: 640 },
  mid:   { s: 1.14, x: 400, y: 600 },
  close: { s: 1.27, x: FACE.x, y: FACE.y },
};

// camera beats: framing changes on phrase starts inside talk shots
const camBeats = [];
(function planCamera() {
  const order = ['mid', 'close', 'wide', 'close', 'mid', 'wide'];
  let n = 0, m = 0;
  for (const sh of shots) {
    if (sh.kind !== 'talk') continue;
    let last = sh.t;
    camBeats.push({ t: sh.t, f: sh.first || ['wide', 'mid'][m++ % 2] });
    for (const c of CAPS) {
      // sentence starts may re-frame after 3.2 s, any phrase start after 4.5 s
      const gap = c.t0 - last;
      if (c.t0 <= sh.t + 2.5 || c.t0 >= sh.end - 1.5 || gap < (c.cut ? 3.2 : 4.5)) continue;
      camBeats.push({ t: c.t0 - 0.04, f: order[n++ % order.length] });
      last = c.t0;
    }
  }
  camBeats.sort((a, b) => a.t - b.t);
})();
// graphics that need room on screen pin the talk framing while they are up
const framingAt = t => {
  const lock = CAMLOCK.find(l => t >= l.t0 && t < l.t1);
  if (lock) return { t: lock.t0, f: lock.f };
  let f = camBeats[0];
  for (const b of camBeats) if (b.t <= t) f = b;
  return f;
};

// ---------- frames ----------
const cache = new Map();
function frameImg(i) {
  i = clamp(i, 1, window.EDIT.FRAMES);
  if (cache.has(i)) return cache.get(i);
  const img = new Image();
  img.src = `assets/frames/${String(i).padStart(5, '0')}.jpg`;
  const p = img.decode().then(() => img);
  cache.set(i, p);
  if (cache.size > 90) cache.delete(cache.keys().next().value);
  return p;
}
const srcIndex = t => Math.round(t * FPS) + 1;

const cam = $('#cam').getContext('2d');
cam.imageSmoothingQuality = 'high';

function drawShot(img, view, opts = {}) {
  const { s, x, y } = view;
  const k = W / SW * s;                  // source px -> canvas px
  // keep the frame covering the canvas, then apply any transition offset
  const dx = clamp(W / 2 - x * k, W - SW * k, 0), dy = clamp(H / 2 - y * k, H - SH * k, 0);
  cam.globalAlpha = opts.alpha ?? 1;
  cam.drawImage(img, dx + (opts.ox || 0), dy, SW * k, SH * k);
  cam.globalAlpha = 1;
}
const transition = (prev, sh) => sh.tr || (prev.kind === sh.kind ? 'bump' : sh.kind === 'broll' ? 'punch' : 'whip');
const WHIP = 0.17;

// grain: a few pre-baked noise tiles, cycled per frame
const grain = Array.from({ length: 4 }, (_, n) => {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const g = c.getContext('2d'), d = g.createImageData(540, 960), r = rng(99 + n);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - .5) * 90; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
});

function viewFor(sh, t) {
  if (sh.kind === 'broll') {
    const k = prog(t, sh.t, sh.end);
    const base = sh.view || { s: 1.0, x: 360, y: 640 };
    return { ...base, s: base.s * lerp(1.0, 1.07, easeInOut(k)) };
  }
  const b = framingAt(t), f = FRAMES[b.f];
  // slow drift inside each framing so the shot never sits still
  const drift = 1 + 0.025 * prog(t, b.t, b.t + 6);
  return { ...f, s: f.s * drift };
}

async function drawCamera(t) {
  const k = shotAt(t), sh = shots[k];
  cam.filter = 'contrast(1.07) saturate(1.16) brightness(1.03)';
  cam.fillStyle = '#000'; cam.fillRect(0, 0, W, H);

  const into = t - sh.t, prev = shots[k - 1];
  const style = prev ? transition(prev, sh) : 'none';
  const v = viewFor(sh, t);
  // a whip spans both sides of its cut
  const w = shots.find((s, i) => i && transition(shots[i - 1], s) === 'whip' && Math.abs(t - s.t) < WHIP);

  if (w) {
    // outgoing and incoming shots slide past each other with a motion smear
    const wi = shots.indexOf(w), cutF = srcIndex(w.t);
    const p = easeInOut(prog(t, w.t - WHIP, w.t + WHIP)), vel = Math.sin(Math.PI * p);
    const tOut = Math.min(t, w.t - 1 / FPS), tIn = Math.max(t, w.t);
    const [imgOut, imgIn] = await Promise.all([frameImg(Math.min(srcIndex(t), cutF - 1)), frameImg(Math.max(srcIndex(t), cutF))]);
    const vOut = viewFor(shots[wi - 1], tOut), vIn = viewFor(w, tIn);
    for (let j = 3; j >= 0; j--) {
      const sm = j * 70 * vel, a = j ? 0.2 : 1;
      drawShot(imgOut, vOut, { ox: p * W - sm, alpha: a });
      drawShot(imgIn, vIn, { ox: (p - 1) * W - sm, alpha: a });
    }
  } else {
    const img = await frameImg(srcIndex(t));
    if (style === 'punch' && into < 0.3) {
      const p = easeOut(prog(into, 0, 0.3));
      const zs = lerp(1.22, 1, p);
      for (let j = 3; j >= 0; j--) drawShot(img, { ...v, s: v.s * zs * (1 + j * 0.025 * (1 - p)) }, { alpha: j ? 0.25 : 1 });
    } else if (style === 'bump' && into < 0.2) {
      drawShot(img, { ...v, s: v.s * lerp(1.06, 1, easeOut(prog(into, 0, 0.2))) });
    } else {
      drawShot(img, v);
    }
  }
  cam.filter = 'none';

  // light flash on punches
  if (prev && style === 'punch' && into < 0.18) {
    cam.fillStyle = `rgba(235,252,255,${0.55 * (1 - prog(into, 0, 0.18))})`;
    cam.fillRect(0, 0, W, H);
  }

  // grade: cool shadows / warm highlights, vignette, caption bed
  cam.globalCompositeOperation = 'soft-light';
  const gr = cam.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, 'rgba(255,214,170,.35)'); gr.addColorStop(1, 'rgba(70,170,200,.35)');
  cam.fillStyle = gr; cam.fillRect(0, 0, W, H);
  cam.globalCompositeOperation = 'source-over';
  const vg = cam.createRadialGradient(W / 2, H * .45, H * .3, W / 2, H * .5, H * .78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
  cam.fillStyle = vg; cam.fillRect(0, 0, W, H);
  const bed = cam.createLinearGradient(0, H * .55, 0, H);
  bed.addColorStop(0, 'rgba(0,0,0,0)'); bed.addColorStop(1, 'rgba(0,0,0,.38)');
  cam.fillStyle = bed; cam.fillRect(0, H * .55, W, H * .45);

  cam.globalCompositeOperation = 'overlay'; cam.globalAlpha = 0.07;
  cam.drawImage(grain[Math.round(t * FPS) % 4], 0, 0, W, H);
  cam.globalCompositeOperation = 'source-over'; cam.globalAlpha = 1;

  // end fade
  const ef = prog(t, END.t - 0.1, END.t + 0.5) * 0.62;
  if (ef > 0) { cam.fillStyle = `rgba(8,22,30,${ef})`; cam.fillRect(0, 0, W, H); }
}

// ---------- captions ----------
// words get times by spreading each phrase over its span, weighted by length
const words = [];
for (const c of CAPS) {
  const toks = c.text.split(/\s+/).filter(Boolean);
  const wts = toks.map(w => w.replace(/[*،.؟!:]/g, '').length + 2.5);
  const sum = wts.reduce((a, b) => a + b, 0);
  let acc = c.t0;
  toks.forEach((w, i) => {
    const d = (c.t1 - c.t0) * wts[i] / sum;
    words.push({ text: w.replace(/\*/g, ''), kw: w.includes('*'), t0: acc, t1: acc + d, phrase: c });
    acc += d;
  });
}
// display groups: up to 3 words / 19 letters, never across a phrase or a punctuation stop
const groups = [];
for (const w of words) {
  let g = groups[groups.length - 1];
  const len = g ? g.words.reduce((a, x) => a + x.text.length + 1, 0) + w.text.length : 0;
  const prevW = g && g.words[g.words.length - 1];
  if (!g || g.phrase !== w.phrase || g.words.length >= 3 || len > 19 || /[،.؟!:]$/.test(prevW.text)) {
    g = { words: [], phrase: w.phrase }; groups.push(g);
  }
  g.words.push(w);
}
for (const g of groups) g.t0 = g.words[0].t0 - 0.06;
groups.forEach((g, i) => {
  const nx = groups[i + 1];
  g.t1 = Math.min(g.words[g.words.length - 1].t1 + 0.35, nx ? nx.t0 : Infinity);
  g.el = document.createElement('div'); g.el.className = 'grp';
  for (const w of g.words) {
    w.el = document.createElement('span');
    w.el.className = 'w' + (w.kw ? ' kw' : '');
    w.el.innerHTML = '<i class="pill"></i>' + w.text.replace(/[،.]$/, '');
    g.el.append(w.el, ' ');
  }
  $('#cap').append(g.el);
});

function drawCaptions(t) {
  const sh = shots[shotAt(t)];
  const capY = t >= END.t ? 1560 : sh.kind === 'broll' ? (sh.capY || 540) : 1430;
  $('#cap').style.top = capY + 'px';
  for (const g of groups) {
    const on = t >= g.t0 && t < g.t1;
    g.el.style.display = on ? 'block' : 'none';
    if (!on) continue;
    const gin = easeBack(prog(t, g.t0, g.t0 + 0.16));
    g.el.style.transform = `translateY(${(1 - gin) * 30}px)`;
    let active = null;
    for (const w of g.words) if (t >= w.t0 - 0.02) active = w;
    for (const w of g.words) {
      const k = prog(t, w.t0 - 0.06, w.t0 + 0.1);
      const s = t < w.t0 - 0.06 ? 0 : lerp(0.6, 1, easeBack(k));
      w.el.style.opacity = t < w.t0 - 0.06 ? 0.0 : 1;
      w.el.style.transform = `scale(${s.toFixed(3)})`;
      w.el.classList.toggle('on', w === active && t < w.t1 + 0.25);
    }
  }
}

// ---------- hook title ----------
$('#hook').innerHTML = `<span class="l a">${HOOK.a}</span><span class="l b"><span>${HOOK.b}</span></span>`;
function drawHook(t) {
  const el = $('#hook'), out = prog(t, HOOK.t1 - 0.3, HOOK.t1);
  el.style.display = t < HOOK.t1 ? 'block' : 'none';
  const a = el.querySelector('.a'), b = el.querySelector('.b span');
  const ka = easeBack(prog(t, HOOK.t0, HOOK.t0 + 0.35)), kb = easeBack(prog(t, HOOK.t0 + 0.3, HOOK.t0 + 0.7));
  a.style.transform = `translateY(${(1 - ka) * -80}px) scale(${lerp(.7, 1, ka)})`;
  a.style.opacity = prog(t, HOOK.t0, HOOK.t0 + .15);
  b.style.transform = `scale(${lerp(.3, 1, kb)}) rotate(${lerp(-8, -2.5, kb)}deg)`;
  b.style.opacity = prog(t, HOOK.t0 + .3, HOOK.t0 + .4);
  el.style.opacity = 1 - out;
  el.style.transform = `translateY(${-easeIn(out) * 120}px)`;
}

// ---------- step chip ----------
function drawChip(t) {
  const el = $('#chip');
  const st = STEPS.find(s => t >= s.t0 && t < s.t1);
  if (!st) { el.style.opacity = 0; return; }
  el.querySelector('.n').textContent = fa(st.n);
  el.querySelector('.txt').textContent = st.text;
  const k = easeBack(prog(t, st.t0, st.t0 + .35)), o = prog(t, st.t1 - .25, st.t1);
  el.style.opacity = Math.min(prog(t, st.t0, st.t0 + .1), 1 - o);
  el.style.transform = `translateX(${(1 - k) * 160 + easeIn(o) * 160}px)`;
}

// ---------- stickers ----------
for (const s of STICKERS) {
  s.el = document.createElement('div'); s.el.className = 'stk'; s.el.textContent = s.e;
  $('#stickers').append(s.el);
}
function drawStickers(t) {
  for (const s of STICKERS) {
    const d = s.d || 1.6, k = prog(t, s.t, s.t + .35), o = prog(t, s.t + d - .25, s.t + d);
    const on = t >= s.t && t < s.t + d;
    s.el.style.opacity = on ? 1 - o : 0;
    if (!on) continue;
    const wob = Math.sin((t - s.t) * 7) * 4 * (1 - k * .6);
    s.el.style.transform = `translate(${s.x - 75}px, ${s.y - 75}px) scale(${(easeBack(k) * (1 - easeIn(o) * .6)).toFixed(3)}) rotate(${(s.r || 0) + wob}deg)`;
  }
}

// ---------- time race ----------
// rows arrive as he names each method; the slow ones get struck out when the winner lands
const VS0 = VS.rows[0].t, WIN = VS.rows.find(r => r.win);
for (const r of VS.rows) {
  r.el = document.createElement('div'); r.el.className = 'row' + (r.win ? ' win' : '');
  r.el.innerHTML = `<span class="lbl">${r.label}</span><span class="val">${r.value}${r.win ? '' : '<i class="strike"></i>'}</span>`;
  $('#vs').append(r.el);
}
function drawVs(t) {
  const el = $('#vs'), out = prog(t, VS.t1 - .3, VS.t1);
  el.style.opacity = t >= VS0 && t < VS.t1 ? 1 - out : 0;
  if (t < VS0 || t >= VS.t1) return;
  el.style.transform = `translateY(${easeIn(out) * 80}px)`;
  const settle = prog(t, WIN.t, WIN.t + .3);
  for (const r of VS.rows) {
    const k = easeBack(prog(t, r.t, r.t + .4));
    r.el.style.opacity = prog(t, r.t, r.t + .12) * (r.win ? 1 : lerp(1, .78, settle));
    r.el.style.transform = r.win
      ? `scale(${lerp(.3, 1, k)}) rotate(${lerp(8, -1.5, k)}deg)`
      : `translateX(${(1 - k) * 320}px) scale(${lerp(1, .9, settle)})`;
    const s = r.el.querySelector('.strike');
    if (s) s.style.transform = `rotate(-6deg) scaleX(${easeOut(prog(t, WIN.t - .35, WIN.t - .05))})`;
  }
}

// ---------- ingredients ----------
$('#ing .ttl').textContent = ING.title;
for (const it of ING.items) {
  it.el = document.createElement('div'); it.el.className = 'row';
  it.el.innerHTML = `<div class="ico">${it.e}</div><div><div class="nm">${it.name}</div><div class="am">${it.amount}</div></div>`;
  $('#ing').append(it.el);
}
function drawIng(t) {
  const el = $('#ing'), out = prog(t, ING.t1 - .35, ING.t1);
  el.style.opacity = t >= ING.t0 && t < ING.t1 ? 1 : 0;
  if (t < ING.t0 || t >= ING.t1) return;
  const kt = easeBack(prog(t, ING.t0, ING.t0 + .4));
  const ttl = el.querySelector('.ttl');
  ttl.style.transform = `scale(${kt}) rotate(${lerp(-12, -3, kt)}deg)`;
  ING.items.forEach((it, i) => {
    const k = easeBack(prog(t, it.t, it.t + .35)), o = easeIn(prog(t - i * .05, ING.t1 - .35, ING.t1));
    it.el.style.opacity = prog(t, it.t, it.t + .1) * (1 - o);
    it.el.style.transform = `translateX(${-(1 - k) * 420 - o * 500}px)`;
  });
  ttl.style.opacity = 1 - out;
}

// ---------- ice sparkles ----------
const fx = $('#fx').getContext('2d');
const BURSTS = [{ t: HOOK.t0 + .3, x: W / 2, y: 1180 }, ...STICKERS.map(s => ({ t: s.t, x: s.x, y: s.y, small: true })),
  { t: END.t + .35, x: W / 2, y: 830 }];
for (const b of BURSTS) {
  const r = rng(Math.round(b.t * 1000) + 7);
  b.parts = Array.from({ length: b.small ? 12 : 30 }, () => ({
    a: r() * Math.PI * 2, v: (b.small ? 260 : 620) * (.4 + r() * .8), s: (b.small ? 8 : 12) * (.5 + r()), spin: (r() - .5) * 8,
  }));
}
// four-point twinkle, the kind of glint light makes on ice
function star(x, y, s, rot, alpha) {
  fx.save(); fx.translate(x, y); fx.rotate(rot); fx.globalAlpha = alpha;
  fx.fillStyle = '#f2feff'; fx.shadowColor = 'rgba(99,226,238,.9)'; fx.shadowBlur = s * 1.2;
  fx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    fx.lineTo(Math.cos(a) * s * 1.6, Math.sin(a) * s * 1.6);
    fx.quadraticCurveTo(0, 0, Math.cos(a + Math.PI / 2) * s * 1.6, Math.sin(a + Math.PI / 2) * s * 1.6);
  }
  fx.fill();
  fx.restore();
}
function drawFx(t) {
  fx.clearRect(0, 0, W, H);
  for (const b of BURSTS) {
    const e = t - b.t;
    if (e < 0 || e > 1.1) continue;
    for (const p of b.parts) {
      const d = p.v * (1 - Math.exp(-e * 3.2)) / 3.2 * 3;
      star(b.x + Math.cos(p.a) * d, b.y + Math.sin(p.a) * d + e * e * 120, p.s, p.spin * e, 1 - prog(e, .5, 1.1));
    }
  }
}

// ---------- end card ----------
$('#end .tag').textContent = END.tag;
$('#end .cta').textContent = END.cta;
function drawEnd(t) {
  const el = $('#end');
  el.style.opacity = prog(t, END.t, END.t + .25);
  const k = easeBack(prog(t, END.t + .1, END.t + .6));
  el.querySelector('.logo').style.transform = `scale(${lerp(.4, 1, k)})`;
  const k2 = easeBack(prog(t, END.t + .5, END.t + .9));
  el.querySelector('.tag').style.transform = `translateY(${(1 - k2) * 60}px)`;
  el.querySelector('.tag').style.opacity = prog(t, END.t + .5, END.t + .6);
  el.querySelector('.cta').style.opacity = prog(t, END.t + 1, END.t + 1.4);
}

// ---------- frame ----------
async function renderAt(t) {
  await drawCamera(t);
  drawCaptions(t);
  drawHook(t);
  drawChip(t);
  drawStickers(t);
  drawVs(t);
  drawIng(t);
  drawFx(t);
  drawEnd(t);
  $('#bar i').style.width = (100 * clamp(t / END.t)).toFixed(2) + '%';
  $('#bar').style.opacity = 1 - prog(t, END.t - .2, END.t);
}

// effects cues for sfx.py
const SFX = [];
for (const [i, s] of shots.entries()) {
  if (!i) continue;
  const style = transition(shots[i - 1], s);
  if (style !== 'bump') SFX.push({ t: s.t - 0.25, type: 'whoosh', gain: style === 'whip' ? 0.9 : 0.7 });
}
SFX.push({ t: HOOK.t0 + .25, type: 'clink', gain: 1 });
for (const s of STICKERS) SFX.push({ t: s.t, type: 'pop', gain: 0.6 });
for (const r of VS.rows) SFX.push(r.win ? { t: r.t, type: 'clink', gain: .9 } : { t: r.t, type: 'pop', gain: .7 });
SFX.push({ t: WIN.t - .4, type: 'whoosh', gain: .4 });
for (const it of ING.items) SFX.push({ t: it.t, type: 'pop', gain: .5 });
SFX.push({ t: END.t - .5, type: 'rise', gain: .6 }, { t: END.t + .15, type: 'clink', gain: 1.1 });

window.DURATION = DURATION;
window.SFX = SFX;
window.renderAt = renderAt;
window.ready = Promise.all([document.fonts.ready, frameImg(1)]);

// ---------- live preview ----------
if (!RENDER) {
  const audio = new Audio('assets/source.mp4');
  let playing = false;
  async function loop() {
    if (!playing) return;
    await renderAt(audio.currentTime);
    requestAnimationFrame(loop);
  }
  $('#play').onclick = () => {
    playing = !playing;
    if (playing) { audio.play(); loop(); } else audio.pause();
  };
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); $('#stage').style.transform = `scale(${s})`; };
  addEventListener('resize', fit); fit();
  window.ready.then(() => renderAt(Number(new URLSearchParams(location.search).get('t') || 0)));
}
</script>
</body>
