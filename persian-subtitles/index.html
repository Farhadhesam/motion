<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زیرنویس فارسی</title>
<style>
  @font-face { font-family: Vazirmatn; src: url(../girls-day/fonts/Vazirmatn-Regular.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Vazirmatn; src: url(../girls-day/fonts/Vazirmatn-Bold.woff2) format("woff2"); font-weight: 700; }
  @font-face { font-family: Vazirmatn; src: url(../girls-day/fonts/Vazirmatn-Black.woff2) format("woff2"); font-weight: 900; }

  :root { --gold: #ffd36b; --amber: #ff9a3d; }
  html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #000; }
  body { position: relative; font-family: Vazirmatn, sans-serif; color: #fff; }
  #frame, #fx { position: absolute; inset: 0; width: 720px; height: 1280px; }

  .glass {
    position: absolute; box-sizing: border-box; opacity: 0;
    background: linear-gradient(160deg, rgba(12, 15, 27, .84), rgba(8, 10, 18, .74));
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .08);
  }

  /* Narration: right-aligned card over the Hebrew lines under the clock. */
  #card { right: 52px; top: 634px; width: 616px; border-radius: 20px; padding: 20px 30px 20px 26px;
          display: flex; align-items: center; }
  #card .bar { position: absolute; right: 12px; top: 18px; bottom: 18px; width: 4px; border-radius: 4px;
               background: linear-gradient(180deg, var(--gold), var(--amber));
               box-shadow: 0 0 14px rgba(255, 190, 90, .6); transform-origin: top; }
  #card .txt { font-weight: 700; font-size: 28px; line-height: 1.72; text-align: right; width: 100%;
               text-shadow: 0 2px 10px rgba(0, 0, 0, .55); text-wrap: balance; }

  /* Dialogue: centred pill over the Hebrew speech subtitles. */
  #pill { left: 360px; top: 931px; border-radius: 26px; }
  .line { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
          width: max-content; max-width: 600px; text-align: center;
          font-weight: 700; font-size: 32px; line-height: 1.5; text-wrap: balance;
          text-shadow: 0 2px 10px rgba(0, 0, 0, .6); opacity: 0; }
  .line .label { font-weight: 400; font-size: 22px; color: var(--gold); margin-left: 10px;
                 padding: 2px 12px; border: 1px solid rgba(255, 211, 107, .55); border-radius: 999px;
                 vertical-align: 4px; }

  .w { display: inline-block; will-change: transform, opacity, filter; }

  /* Outro on black. */
  #outro { position: absolute; left: 0; right: 0; top: 600px; text-align: center;
           font-weight: 900; font-size: 40px; line-height: 1.4;
           text-shadow: 0 0 26px rgba(255, 200, 100, .35); }
  #mask { position: absolute; left: 150px; top: 592px; width: 420px; height: 96px;
          background: #000; box-shadow: 0 0 16px 10px #000; opacity: 0; }
</style>
</head>
<body>
<img id="frame" alt="">
<canvas id="fx" width="720" height="1280"></canvas>
<div id="card" class="glass"><div class="bar"></div><div class="txt"></div></div>
<div id="pill" class="glass"></div>
<div id="mask"></div>
<div id="outro"></div>

<script src="subs.js"></script>
<script>
const S = window.SUBS;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const mix = (a, b, k) => a + (b - a) * k;

const $ = s => document.querySelector(s);
const card = $('#card'), cardBar = $('#card .bar'), cardTxt = $('#card .txt');
const pill = $('#pill'), mask = $('#mask'), outro = $('#outro');

// Split text into word spans so each word can be animated without breaking Persian letter joining.
function words(el, text) {
  el.textContent = '';
  return text.split(' ').map((w, i) => {
    if (i) el.append(' ');
    const s = document.createElement('span');
    s.className = 'w'; s.textContent = w; el.append(s);
    return s;
  });
}

// ---------- narration ----------
const LINE_PITCH = 56;  // Hebrew caption line spacing, px
for (const n of S.narration) {
  // The card must reach below the last Hebrew line (first line starts at y≈650).
  n.minH = (690 + LINE_PITCH * (n.lines - 1) + 16) - 634;
}
let shownNarr = null, narrWords = [];

function renderNarration(t) {
  const n = S.narration.find(n => t >= n.t0 - 0.08 && t < n.t1 + 0.24);
  if (!n) { card.style.opacity = 0; return; }
  if (shownNarr !== n) {
    shownNarr = n;
    narrWords = words(cardTxt, n.fa);
    card.style.height = 'auto';
    card.style.height = Math.max(n.minH, card.offsetHeight) + 'px';
  }
  // Fully opaque by t0 + 0.08 — before any Hebrew line has been typed — and gone 0.24 s after the Hebrew.
  const kIn = easeOut(prog(t, n.t0 - 0.08, 0.16)), kOut = easeInOut(prog(t, n.t1, 0.24));
  card.style.opacity = kIn * (1 - kOut);
  card.style.transform = `translateY(${(1 - kIn) * 14 + kOut * 8}px)`;
  cardBar.style.transform = `scaleY(${easeOut(prog(t, n.t0, 0.5))})`;
  // Words type in as the Hebrew does.
  const step = Math.min(0.09, 1.3 / narrWords.length);
  narrWords.forEach((w, i) => {
    const k = easeOut(prog(t, n.type + i * step, 0.38));
    w.style.opacity = k;
    w.style.transform = `translateY(${(1 - k) * 12}px)`;
    w.style.filter = k < 1 ? `blur(${(1 - k) * 6}px)` : 'none';
  });
}

// ---------- dialogue ----------
const PAD_X = 30, PAD_Y = 16, MIN_H = 96, MARGIN = 20;
// Lines closer than this share one pill, and the text stays up through the short silence.
const GROUP_GAP = 0.65;
const groups = [];
S.dialogue.forEach((d, i) => {
  d.el = document.createElement('div');
  d.el.className = 'line';
  if (d.label) { const l = document.createElement('span'); l.className = 'label'; l.textContent = d.label; d.el.append(l); }
  const body = document.createElement('span'); d.el.append(body);
  d.spans = [];
  d.beats.forEach(([bt, text, br], j) => {
    if (br) body.append(document.createElement('br')); else if (j) body.append(' ');
    const holder = document.createElement('span'); body.append(holder);
    d.spans.push({ t: bt, ws: words(holder, text) });
  });
  pill.append(d.el);
  const prev = S.dialogue[i - 1];
  if (prev && d.t0 - prev.t1 < GROUP_GAP) groups[groups.length - 1].push(d); else groups.push([d]);
});
function measure() {
  for (const d of S.dialogue) {
    const r = d.el.getBoundingClientRect();
    const cover = d.heb ? 2 * Math.max(360 - d.heb[0], d.heb[1] - 360) + 2 * MARGIN : 0;
    d.w = Math.max(r.width + 2 * PAD_X, cover);
    d.h = Math.max(r.height + 2 * PAD_Y, MIN_H);
  }
  for (const g of groups) g.forEach((d, i) => { d.show1 = g[i + 1] ? g[i + 1].t0 : d.t1; });
}

function pillSize(g, t) {
  // Grow before a new line starts (so its Hebrew is covered from its first frame),
  // shrink only after the previous line's Hebrew is gone.
  let w = g[0].w, h = g[0].h;
  for (let i = 1; i < g.length; i++) {
    const a = g[i - 1], b = g[i];
    const W = Math.max(a.w, b.w), H = Math.max(a.h, b.h);
    const pre = easeInOut(prog(t, b.t0 - 0.12, 0.12)), post = easeInOut(prog(t, b.t0, 0.16));
    if (t < b.t0) { w = mix(w, W, pre); h = mix(h, H, pre); break; }
    w = mix(W, b.w, post); h = mix(H, b.h, post);
  }
  return [w, h];
}

function renderDialogue(t) {
  const g = groups.find(g => t >= g[0].t0 - 0.12 && t < g[g.length - 1].t1 + 0.2);
  for (const d of S.dialogue) d.el.style.opacity = 0;
  if (!g) { pill.style.opacity = 0; return; }
  const gEnd = g[g.length - 1].t1;
  const kIn = easeOut(prog(t, g[0].t0 - 0.12, 0.14)), kOut = easeInOut(prog(t, gEnd, 0.2));
  const [w, h] = pillSize(g, t);
  pill.style.opacity = kIn * (1 - kOut);
  pill.style.width = w + 'px'; pill.style.height = h + 'px';
  pill.style.transform = `translate(-50%, -50%) scale(${mix(0.94, 1, kIn) - kOut * 0.04})`;
  g.forEach((d, i) => {
    // Switch lines on the exact frame the next Hebrew chunk appears, so two lines never overlap;
    // the last line stays until the pill has faded out.
    if (t < d.t0 || (i < g.length - 1 && t >= d.show1)) return;
    d.el.style.opacity = 1;
    d.spans.forEach((b, j) => {
      const until = d.spans[j + 1] ? d.spans[j + 1].t : d.t1;   // the beat is "being spoken" until the next one
      const kIn = easeOut(prog(t, b.t - 0.04, 0.14));
      const lit = 1 - prog(t, until, 0.22);                    // gold while spoken, then white
      b.ws.forEach(s => {
        s.style.opacity = kIn;
        s.style.transform = `translateY(${(1 - kIn) * 8}px) scale(${mix(0.92, 1, kIn)})`;
        s.style.color = `rgb(255, ${Math.round(mix(255, 211, lit))}, ${Math.round(mix(255, 107, lit))})`;
      });
    });
  });
}

// ---------- outro ----------
const outroWords = words(outro, S.outro.fa);
function renderOutro(t) {
  const o = S.outro;
  mask.style.opacity = t >= o.t0 - 0.04 ? 1 : 0;
  outroWords.forEach((w, i) => {
    const k = easeOut(prog(t, o.t0 + i * 0.18, 0.6));
    w.style.opacity = k;
    w.style.transform = `translateY(${(1 - k) * 16}px)`;
    w.style.filter = k < 1 ? `blur(${(1 - k) * 8}px)` : 'none';
  });
}

// Headless Chromium has no backdrop-filter, so paint the blurred frame under each visible glass panel.
const frame = $('#frame'), fx = $('#fx').getContext('2d');
function renderGlass() {
  fx.clearRect(0, 0, 720, 1280);
  for (const el of [card, pill]) {
    const a = +el.style.opacity;
    if (!a) continue;
    const r = el.getBoundingClientRect();
    fx.save();
    fx.globalAlpha = a;
    fx.beginPath(); fx.roundRect(r.x, r.y, r.width, r.height, parseFloat(getComputedStyle(el).borderTopLeftRadius)); fx.clip();
    fx.filter = 'blur(30px) saturate(1.3) brightness(.7)';
    fx.drawImage(frame, 0, 0, 720, 1280);
    fx.restore();
  }
}

function renderAt(t) {
  renderNarration(t);
  renderDialogue(t);
  renderOutro(t);
  renderGlass();
}

window.renderAt = renderAt;
window.SUBS_DURATION = S.duration;
window.ready = document.fonts.ready.then(() => { measure(); renderAt(0); });
</script>
</body>
</html>
